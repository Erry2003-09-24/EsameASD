name: Build and Deploy Java App with Docker

on:
  push:
    branches:
      - automated_software_delivery-2025
  pull_request:
    branches:
      - automated_software_delivery-2025

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java and Maven
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Checkstyle
        run: mvn checkstyle:check --file pom.xml

      - name: Run tests
        run: mvn test --file pom.xml

      - name: Build Java application with Maven
        run: mvn -B package --file pom.xml

      - name: Export Docker username to environment
        run: echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image with Docker Compose
        run: |
          docker compose build esame-app
          docker compose push esame-app
